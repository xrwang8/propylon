# Propylon Gateway Configuration Example
version: "v1"

server:
  addr: "0.0.0.0:8080"
  mode: "http" # Options: http, sse, stdio

# Audit & Telemetry
audit:
  enabled: true
  output: "stdout" # Options: stdout, file
  log_arguments: true
  mask_sensitive_data: true

# Agent Dead-Loop & Rate-Limit Circuit Breaker
circuit_breaker:
  enabled: true
  max_calls_per_minute: 60      # Global speed limit per session
  loop_threshold: 4             # Maximum identical tool calls allowed within window
  loop_window_seconds: 10       # Sliding detection window in seconds

# Remote Webhook for Human-in-the-Loop Approval Alerts
webhook:
  url: "https://httpbin.org/post" # Replace with your Slack / Feishu / DingTalk incoming webhook
  timeout_seconds: 15

# Upstream Backend Tools (MCP Servers / Tool APIs)
upstreams:
  - name: "database-service"
    type: "mcp-sse"
    target: "http://localhost:9001/sse"
    description: "PostgreSQL Database MCP Server"

  - name: "system-shell"
    type: "mcp-stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    description: "Filesystem & Shell Tool Provider"

# Security & Governance Policies (Hot-reloaded automatically on save)
policies:
  # Rule 1: High-risk shell command blocking
  - id: "block-dangerous-bash"
    name: "Block Destructive Shell Commands"
    target_tools: ["execute_command", "run_bash", "shell"]
    action: "block"
    conditions:
      param_matches:
        command:
          - '(?i)rm\s+-rf\s+/'
          - '(?i)mkfs'
          - '(?i)dd\s+if='
          - '(?i):\(\)\{\s*:\|\:&\s*\};:' # Fork bomb
    message: "Security Policy Violation: Destructive shell command detected."

  # Rule 2: SQL destructive query protection
  - id: "guard-sql-mutation"
    name: "Prevent Table Drops and Truncates"
    target_tools: ["query_sql", "execute_query"]
    action: "block"
    conditions:
      param_matches:
        query:
          - '(?i)\bDROP\s+TABLE\b'
          - '(?i)\bTRUNCATE\b'
          - '(?i)\bALTER\s+TABLE\b'
    message: "Security Policy Violation: Schema drop/truncate operations are prohibited for autonomous agents."

  # Rule 3: Human-in-the-Loop (HITL) interactive approval with Webhook
  - id: "require-approval-for-deploy"
    name: "Require Human Approval for Production Deployments"
    target_tools: ["deploy_service", "restart_cluster", "modify_config"]
    action: "require_approval"
    approval_channel: "terminal" # Options: terminal, webhook
    timeout: "60s"
    message: "Agent is requesting execution of a production-altering action. Awaiting human confirmation."

  # Rule 4: Webhook-dispatched critical operation
  - id: "audit-data-export"
    name: "Alert Security Channel on Bulk Data Export"
    target_tools: ["export_records", "dump_database"]
    action: "require_approval"
    approval_channel: "webhook"
    timeout: "30s"
    message: "Large dataset export requested by Agent. Security team alert dispatched."
